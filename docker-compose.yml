# ============================================================
# Olist ETL Pipeline - Docker Compose (Airflow 3.x)
#
# Services:
#   airflow-db           Airflow's OWN metadata database (task
#                          state, DAG runs, connections, etc.) -
#                          NOT business data.
#   airflow-init          One-off container that initializes the
#                          Airflow DB and creates the admin user.
#   airflow-api-server     Airflow 3's React-based UI + REST API
#                          (replaces the old Flask "webserver").
#   airflow-scheduler      Schedules + executes tasks (LocalExecutor).
#   airflow-dag-processor  Parses DAG files (its own component as
#                          of Airflow 3 - the scheduler no longer
#                          parses DAGs itself).
#
# IMPORTANT - per spec, business data (Gold tables + pipeline
# metadata) is loaded into the person's LOCAL PostgreSQL instance
# on the Windows host, NOT into a Postgres container. There is
# deliberately no "warehouse-db" service here. Containers reach the
# host via `host.docker.internal` (built into Docker Desktop for
# Windows/Mac; the extra_hosts entry below adds the same behaviour
# on Linux). The MySQL source database (olist_db) is reached the
# same way.
#
# Usage:
#   1. Copy .env.example to .env and fill in real credentials
#      (local Postgres password, MySQL password, email app
#      password, source-file locations, etc.)
#   2. Make sure your LOCAL PostgreSQL is running, reachable on
#      DB_PORT, and the `warehouse_db` (or your DB_NAME) database
#      already exists (create it once: `createdb warehouse_db`,
#      or run sql/create_tables.sql against it - pandas will also
#      create the Gold tables automatically on first load).
#   3. docker compose up airflow-init   (first time only)
#   4. docker compose up -d
#   5. Open http://localhost:8080 (default admin/admin, see
#      airflow-init command below)
# ============================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-api-server:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    PIPELINE_NAME: ${PIPELINE_NAME:-Olist_ETL_Pipeline}

    CUSTOMERS_PATH: /opt/airflow/source_data/CRM/customers.csv
    GEOLOCATION_PATH: /opt/airflow/source_data/CRM/geolocation.csv
    SELLERS_PATH: /opt/airflow/source_data/CRM/olist_sellers_dataset.csv

    ORDERS_PATH: /opt/airflow/source_data/OMS/orders.json
    ORDER_ITEMS_PATH: /opt/airflow/source_data/OMS/order_items.json

    PRODUCTS_PATH: /opt/airflow/source_data/PIM/products.xml
    PRODUCT_CATEGORY_TRANSLATION_PATH: /opt/airflow/source_data/PIM/product_category_translation.xml

    BRONZE_PATH: data/bronze
    SILVER_PATH: data/silver
    GOLD_PATH: data/gold
    REJECTED_PATH: data/rejected
    #local postgres connection
    DB_HOST: host.docker.internal
    DB_PORT: ${DB_PORT:-5432}
    DB_NAME: ${DB_NAME:-warehouse_db}
    DB_USER: ${DB_USER:-postgres}
    DB_PASSWORD: ${DB_PASSWORD}

    MYSQL_HOST: host.docker.internal
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-olist_db}
    MYSQL_USER: ${MYSQL_USER:-root}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    METADATA_TABLE: pipeline_metadata
    AUDIT_TABLE: pipeline_audit

    EMAIL_SENDER: ${EMAIL_SENDER}
    EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    EMAIL_RECEIVER: ${EMAIL_RECEIVER}
    SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
    SMTP_PORT: ${SMTP_PORT:-587}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./config:/opt/airflow/config
    - ./sql:/opt/airflow/sql
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./main.py:/opt/airflow/main.py
    - "${OLIST_SOURCE_DIR}:/opt/airflow/source_data:ro"

  working_dir: /opt/airflow

  extra_hosts:
    - "host.docker.internal:host-gateway"

  depends_on:
    airflow-db:
      condition: service_healthy

services:

  # ----------------------------------------------------------
  # Airflow's own metadata database (task state / DAG runs only -
  # business data never goes here, see header comment above).
  # ----------------------------------------------------------
  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com
    restart: "no"

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - airflow-init
      - airflow-api-server
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      - airflow-init
      - airflow-api-server
    restart: unless-stopped

volumes:
  airflow-db-data:
